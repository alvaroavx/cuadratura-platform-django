{% with current=request.resolver_match.url_name %}
<nav class="local-nav" aria-label="Secciones de la organización">
  <a href="{% url 'organization-period' organization.id period|date:'Y-m' %}" {% if current == 'organization-period' or current == 'manual-operation' or current == 'manual-receipt' %}aria-current="page"{% endif %}>Resumen</a>
  <a href="{% url 'organization-period' organization.id period|date:'Y-m' %}#operaciones">Operaciones</a>
  {% if access.can_import %}<a href="{% url 'import-list' organization.id period|date:'Y-m' %}" {% if 'import' in current %}aria-current="page"{% endif %}>Importaciones</a>{% endif %}
  {% if access.can_close %}<a href="{% url 'organization-period' organization.id period|date:'Y-m' %}#cierres" {% if current == 'close-period' or current == 'reopen-period' %}aria-current="page"{% endif %}>Cierres</a>{% endif %}
  <a href="{% url 'organization-period' organization.id period|date:'Y-m' %}#reportes">Reportes</a>
  {% if access.can_close %}<a href="{% url 'audit-list' organization.id %}?period={{ period|date:'Y-m' }}" {% if current == 'audit-list' %}aria-current="page"{% endif %}>Auditoría</a>{% endif %}
  {% if access.can_admin %}<a href="{% url 'organization-administration' organization.id period|date:'Y-m' %}" {% if current == 'organization-administration' %}aria-current="page"{% endif %}>Administración</a>{% endif %}
</nav>
{% endwith %}
